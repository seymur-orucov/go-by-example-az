# Git syllabus — built with the plan-syllabus skill.
# v1 approved 2026-11-26 (39 nodes); v2 2026-11-26: the full roadmap.sh/git-github scope, one node
# per roadmap topic, split into two parts (Git, GitHub).
# Node ids are stable once a lesson is published (they become /git/<id>/).
# `topics`: English keywords the lesson must cover; the first one is the roadmap.sh topic name.
technology: git
title: "Git"
status: approved
audience: "Bir proqramlaşdırma dilini bilən, amma Git-dən istifadə etməmiş developer."
level: "Gündəlik iş və müsahibə səviyyəsində anlayış (Git içəridə necə işləyir), üstəlik GitHub platformasının əsas imkanları."
updated: 2026-11-26
syntax: "Modern commands (git switch, git restore; Git 2.23+) are the main syntax; checkout is only mentioned."
outOfScope:
  - "Git server setup and transfer protocols (not on the roadmap)"
  - "GitHub Enterprise administration and billing"
sources:
  - { name: roadmap.sh, url: "https://roadmap.sh/git-github", used: "topic list and order (git-github.json)" }
  - { name: Pro Git, url: "https://git-scm.com/book/en/v2", used: "order, depth, fact checking" }
  - { name: GitHub Docs, url: "https://docs.github.com/en", used: "GitHub part: fact checking" }
parts:
  - id: git
    title: "Hissə 1 · Git"
    description: "Git-in özü: lokal iş, branch-lar, remote-lar, tarixçəni idarə etmək və dərinlik."
  - id: github
    title: "Hissə 2 · GitHub"
    description: "GitHub platforması: əməkdaşlıq, layihələr, Actions, CLI, API və ekosistem."
modules:
  # ================================ PART 1 · GIT ================================
  - id: basics
    part: git
    title: "Əsaslar"
    description: "Version control-un nə üçün lazım olduğu, Git-in quraşdırılması və üç sahə."
    nodes:
      - id: what-is-version-control
        title: "Version control nədir"
        outcome: "Oxucu version control-un hansı problemi həll etdiyini izah edə bilir."
        kind: concept
        facets: [theory, test]
        requires: []
        duration: 5
        topics: [What is Version Control?, Why use Version Control?, centralized vs distributed]
      - id: git-vs-other-vcs
        title: "Git və digər VCS-lər"
        outcome: "Oxucu Git-i SVN kimi mərkəzləşmiş sistemlərlə müqayisə edib fərqləri izah edə bilir."
        kind: compare
        facets: [theory, visual, test]
        requires: [what-is-version-control]
        duration: 5
        topics: [Git vs Other VCS, SVN, Mercurial]
      - id: what-is-a-repository
        title: "Repository nədir"
        outcome: "Oxucu repository-nin nədən ibarət olduğunu və lokal ilə uzaq repository fərqini izah edə bilir."
        kind: concept
        facets: [theory, test]
        requires: [what-is-version-control]
        duration: 5
        topics: [What is a Repository, local vs remote repository]
      - id: install-git
        title: "Git-i quraşdırmaq"
        outcome: "Oxucu Git-i öz əməliyyat sistemində quraşdırıb versiyasını yoxlaya bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [what-is-version-control]
        duration: 4
        topics: [Installing Git Locally, git --version]
      - id: git-config
        title: "git config"
        outcome: "Oxucu adını və email-ini təyin edib lokal və qlobal config arasındakı fərqi izah edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [install-git]
        duration: 6
        topics: [git config, Local vs Global Config, user.name, user.email, init.defaultBranch]
      - id: git-init
        title: "git init"
        outcome: "Oxucu yeni repository yarada və .git qovluğunun rolunu izah edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [git-config, what-is-a-repository]
        duration: 5
        topics: [git init, .git directory]
      - id: three-areas
        title: "Üç sahə"
        outcome: "Oxucu working directory, staging area və repository arasındakı axını izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test, interview]
        requires: [git-init]
        duration: 8
        topics: [Working Directory, Staging Area, index, repository]

  - id: first-commits
    part: git
    title: "İlk commit-lər"
    description: "Stage və commit, vəziyyəti oxumaq, dəyişikliklərə baxmaq və lazımsız faylları çıxarmaq."
    nodes:
      - id: first-commit
        title: "İlk commit: add və commit"
        outcome: "Oxucu faylları stage edib commit edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [three-areas]
        duration: 7
        topics: [Committing Changes, git add, git commit]
      - id: git-status
        title: "git status"
        outcome: "Oxucu git status çıxışından faylın untracked, modified və ya staged olduğunu oxuya bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [first-commit]
        duration: 5
        topics: [git status, untracked, modified, staged, git status -s]
      - id: diff-unstaged
        title: "Unstage dəyişikliklərə baxmaq"
        outcome: "Oxucu git diff ilə hələ stage edilməmiş dəyişiklikləri oxuya bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [git-status]
        duration: 5
        topics: [Unstaged Changes, git diff, diff hunks]
      - id: diff-staged
        title: "Stage edilmiş dəyişikliklərə baxmaq"
        outcome: "Oxucu git diff --staged ilə növbəti commit-ə nəyin düşəcəyini yoxlaya bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [diff-unstaged]
        duration: 5
        topics: [Staged Changes, git diff --staged, git diff --cached]
      - id: gitignore
        title: ".gitignore"
        outcome: "Oxucu lazımsız faylları .gitignore ilə izlənmədən çıxara bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [git-status]
        duration: 5
        topics: [.gitignore, patterns, already tracked files, git rm --cached]

  - id: history
    part: git
    title: "Tarixçə"
    description: "Commit-in əslində nə olduğu, tarixçəyə baxmaq, HEAD və commit-lər arası fərq."
    nodes:
      - id: commit-snapshot
        title: "Commit nədir: snapshot, hash, parent"
        outcome: "Oxucu commit-in diff yox, snapshot olduğunu və parent ilə zəncir qurduğunu izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test, interview]
        requires: [first-commit]
        duration: 8
        topics: [snapshot, commit hash, parent commit, commit graph]
      - id: git-log
        title: "git log"
        outcome: "Oxucu git log və git show ilə commit tarixçəsinə baxa bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [commit-snapshot]
        duration: 6
        topics: [Viewing Commit History, git log, git show]
      - id: git-log-options
        title: "git log seçimləri"
        outcome: "Oxucu tarixçəni müəllifə, tarixə, fayla və mətnə görə filtrləyib qraf şəklində göstərə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [git-log]
        duration: 7
        topics: [git log options, --oneline, --graph, --author, --since, -p, -S, path filter]
      - id: head
        title: "HEAD nədir"
        outcome: "Oxucu HEAD-in nəyi göstərdiyini və commit-dən sonra necə hərəkət etdiyini izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [commit-snapshot]
        duration: 6
        topics: [HEAD, HEAD~1, HEAD^]
      - id: diff-between-commits
        title: "Commit-lər arası fərq"
        outcome: "Oxucu iki commit arasındakı fərqi bütövlükdə və ya bir fayl üçün göstərə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [head, diff-staged]
        duration: 6
        topics: [Between Commits, git diff A B, git diff HEAD~2, --stat]
      - id: commit-messages
        title: "Yaxşı commit mesajı"
        outcome: "Oxucu qısa, aydın və tarixçədə faydalı commit mesajı yaza bilir."
        kind: concept
        facets: [theory, test]
        requires: [first-commit]
        duration: 5
        topics: [Commit Messages, subject and body, imperative mood, Conventional Commits]

  - id: branches
    part: git
    title: "Branch-lar"
    description: "Branch-ın pointer olması, yaratmaq, keçmək, adlandırmaq, silmək və müqayisə etmək."
    nodes:
      - id: what-is-a-branch
        title: "Branch: commit-ə pointer"
        outcome: "Oxucu branch-ın sadəcə commit-ə pointer olduğunu və buna görə ucuz olduğunu izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test, interview]
        requires: [head]
        duration: 7
        topics: [Branching Basics, branch as a pointer, HEAD points to a branch]
      - id: creating-branch
        title: "Branch yaratmaq"
        outcome: "Oxucu cari və ya istənilən commit-dən yeni branch yarada bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [what-is-a-branch]
        duration: 5
        topics: [Creating Branch, git branch <name>, git switch -c, git branch -v]
      - id: switch-branches
        title: "Branch-lar arasında keçmək"
        outcome: "Oxucu git switch ilə branch-lar arasında keçə və keçidin working directory-ni necə dəyişdiyini izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [creating-branch]
        duration: 6
        topics: [Checkout Branch, git switch, git switch -, git checkout (mention), uncommitted changes on switch]
      - id: renaming-branch
        title: "Branch-ın adını dəyişmək"
        outcome: "Oxucu lokal və remote branch-ın adını dəyişə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [creating-branch]
        duration: 4
        topics: [Renaming Branch, git branch -m, renaming the remote branch]
      - id: deleting-branch
        title: "Branch-ı silmək"
        outcome: "Oxucu merge olunmuş və olunmamış branch-ı -d və -D ilə silə və fərqi izah edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [creating-branch]
        duration: 5
        topics: [Deleting Branch, git branch -d, git branch -D, git push origin --delete]
      - id: branch-naming
        title: "Branch adlandırma"
        outcome: "Oxucu komandanın konvensiyasına uyğun, mənalı branch adı seçə bilir."
        kind: concept
        facets: [theory, test]
        requires: [creating-branch]
        duration: 4
        topics: [Branch Naming, feat/ fix/ prefixes, ticket ids]
      - id: detached-head
        title: "Detached HEAD"
        outcome: "Oxucu detached HEAD vəziyyətini tanıyıb oradan commit itirmədən çıxa bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [switch-branches]
        duration: 6
        topics: [Detached HEAD, git switch --detach, saving work with a new branch]
      - id: diff-between-branches
        title: "Branch-lar arası fərq"
        outcome: "Oxucu iki branch arasındakı fərqi .. və ... sintaksisi ilə göstərib onların fərqini izah edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [switch-branches, diff-between-commits]
        duration: 6
        topics: [Between Branches, git diff main..feature, git diff main...feature, git log main..feature]

  - id: merging
    part: git
    title: "Merge"
    description: "Branch-ları birləşdirmək: fast-forward, merge commit, squash və konfliktlər."
    nodes:
      - id: merging-basics
        title: "git merge əsasları"
        outcome: "Oxucu bir branch-ı digərinə merge edib nəticəni git log ilə yoxlaya bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [switch-branches]
        duration: 6
        topics: [Merging Basics, git merge, merge target vs source]
      - id: fast-forward-merge
        title: "Fast-forward merge"
        outcome: "Oxucu fast-forward merge-in nə vaxt baş verdiyini qrafda göstərə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [merging-basics]
        duration: 7
        topics: [fast-forward]
      - id: three-way-merge
        title: "Merge commit (three-way merge)"
        outcome: "Oxucu merge commit-in iki parent-i olduğunu və nə vaxt yarandığını izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test, interview]
        requires: [fast-forward-merge]
        duration: 8
        topics: [Merge Strategies, three-way merge, merge base, ort strategy]
      - id: ff-vs-no-ff
        title: "Fast-forward və --no-ff"
        outcome: "Oxucu --ff-only və --no-ff arasında tarixçəyə təsirinə görə seçim edə bilir."
        kind: compare
        facets: [theory, practice, visual, test, interview]
        requires: [three-way-merge]
        duration: 6
        topics: [Fast-Forward vs Non-FF, --no-ff, --ff-only]
      - id: squash-merge
        title: "Squash merge"
        outcome: "Oxucu branch-ın bütün commit-lərini git merge --squash ilə bir commit kimi gətirə və bunun tarixçəyə təsirini izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [three-way-merge]
        duration: 6
        topics: [Squash, git merge --squash, squash and merge on GitHub]
      - id: merge-conflicts
        title: "Konfliktlər"
        outcome: "Oxucu merge konfliktini həll edib merge-i bitirə və ya ləğv edə bilir."
        kind: terminal
        facets: [theory, practice, test, interview]
        requires: [three-way-merge]
        duration: 9
        topics: [Handling Conflicts, conflict markers, git merge --abort, mergetool]

  - id: remotes
    part: git
    title: "Remote-lar"
    description: "Uzaq repository ilə işləmək: clone, remote-ları idarə etmək, fetch, pull və push."
    nodes:
      - id: remotes-and-clone
        title: "Remote nədir"
        outcome: "Oxucu lokal və uzaq repository arasındakı əlaqəni və origin-in nə olduğunu izah edə bilir."
        kind: diagram
        facets: [theory, visual, test]
        requires: [what-is-a-branch]
        duration: 6
        topics: [Git Remotes, origin, remote URL, HTTPS vs SSH]
      - id: cloning-repositories
        title: "Repository-ni clone etmək"
        outcome: "Oxucu repository-ni HTTPS və ya SSH ilə clone edib nəyin gəldiyini (branch-lar, origin) izah edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [remotes-and-clone]
        duration: 5
        topics: [Cloning Repositories, git clone, --depth, cloning into a folder]
      - id: managing-remotes
        title: "Remote-ları idarə etmək"
        outcome: "Oxucu remote əlavə edə, adını və URL-ni dəyişə və silə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [cloning-repositories]
        duration: 5
        topics: [Managing Remotes, git remote -v, git remote add, rename, set-url, remove]
      - id: fetch-and-pull
        title: "fetch və pull"
        outcome: "Oxucu origin/main-in nə olduğunu və fetch ilə pull arasındakı fərqi izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test, interview]
        requires: [cloning-repositories, merging-basics]
        duration: 8
        topics: [Pushing / Pulling Changes, remote-tracking branches, git pull, pull = fetch + merge, pull --rebase]
      - id: fetch-without-merge
        title: "Merge etmədən fetch"
        outcome: "Oxucu fetch-dən sonra gələn dəyişikliklərə baxıb onları nə vaxt və necə birləşdirəcəyini seçə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [fetch-and-pull]
        duration: 5
        topics: [Fetch without Merge, git fetch, git log HEAD..origin/main, git fetch --prune]
      - id: push
        title: "push və upstream"
        outcome: "Oxucu branch-ı push edib upstream təyin edə bilir və rədd edilən push-un səbəbini anlayır."
        kind: terminal
        facets: [theory, practice, test]
        requires: [fetch-and-pull]
        duration: 6
        topics: [pushing changes, upstream, git push -u, rejected non-fast-forward push]

  - id: tags
    part: git
    title: "Tag-lar"
    description: "Versiyaları tag ilə işarələmək, idarə etmək, paylaşmaq və tag-a keçmək."
    nodes:
      - id: tags
        title: "Tag nədir"
        outcome: "Oxucu lightweight və annotated tag yarada və onların fərqini izah edə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [head]
        duration: 6
        topics: [Tagging, lightweight vs annotated, git tag -a, semantic versioning]
      - id: managing-tags
        title: "Tag-ları idarə etmək"
        outcome: "Oxucu tag-ları siyahılaya, filtrləyə, köhnə commit-ə tag qoya və silə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [tags]
        duration: 5
        topics: [Managing Tags, git tag -l, git tag -d, tagging an older commit]
      - id: pushing-tags
        title: "Tag-ları push etmək"
        outcome: "Oxucu tag-ları remote-a göndərə və remote-dakı tag-ı silə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [managing-tags, push]
        duration: 5
        topics: [Pushing Tags, git push origin <tag>, --tags, --follow-tags, deleting a remote tag]
      - id: checkout-tags
        title: "Tag-a keçmək"
        outcome: "Oxucu tag-dakı kodu açıb ondan branch yarada bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [tags, detached-head]
        duration: 5
        topics: [Checkout Tags, git switch --detach <tag>, git switch -c <branch> <tag>]

  - id: undo
    part: git
    title: "Səhvləri düzəltmək"
    description: "Dəyişikliyi və commit-i geri almağın yolları və hansını nə vaxt seçmək."
    nodes:
      - id: restore
        title: "git restore"
        outcome: "Oxucu fayldakı və staging-dəki dəyişikliyi git restore ilə geri ala bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [diff-staged]
        duration: 6
        topics: [Undoing Changes, git restore, git restore --staged, git restore --source]
      - id: amend
        title: "commit --amend"
        outcome: "Oxucu son commit-in mesajını və məzmununu düzəldə bilir və bunun yeni commit yaratdığını bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [commit-snapshot]
        duration: 5
        topics: [git commit --amend, --no-edit]
      - id: git-revert
        title: "git revert"
        outcome: "Oxucu commit-in təsirini git revert ilə yeni commit yaradaraq ləğv edə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [commit-snapshot]
        duration: 6
        topics: [git revert, reverting a merge commit (-m), --no-commit]
      - id: reset-soft
        title: "reset --soft"
        outcome: "Oxucu reset --soft ilə commit-ləri geri alıb dəyişiklikləri staging-də saxlaya bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [three-areas, head]
        duration: 6
        topics: [--soft, git reset, squashing the last commits]
      - id: reset-mixed
        title: "reset --mixed"
        outcome: "Oxucu reset --mixed-in commit-i və staging-i geri aldığını, faylları isə saxladığını göstərə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [reset-soft]
        duration: 6
        topics: [--mixed, default mode, unstaging]
      - id: reset-hard
        title: "reset --hard"
        outcome: "Oxucu reset --hard-ın üç sahəni də dəyişdiyini və hansı işi geri qaytarılmaz itirə biləcəyini izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [reset-mixed]
        duration: 6
        topics: [--hard, lost uncommitted changes, git reset --hard origin/main]
      - id: reset-modes
        title: "reset: hansı rejim?"
        outcome: "Oxucu vəziyyətə görə git reset-in üç rejimindən düzgün olanı seçə bilir."
        kind: compare
        facets: [theory, practice, visual, test, interview]
        requires: [reset-hard]
        duration: 7
        topics: [git reset, --soft vs --mixed vs --hard]
      - id: revert-vs-reset
        title: "revert və reset"
        outcome: "Oxucu paylaşılmış tarixçədə revert-in, lokal tarixçədə reset-in niyə seçildiyini əsaslandıra bilir."
        kind: compare
        facets: [theory, visual, test, interview]
        requires: [reset-modes, git-revert]
        duration: 7
        topics: [shared vs local history]

  - id: rewrite
    part: git
    title: "Tarixçəni yenidən yazmaq"
    description: "rebase, interactive rebase, cherry-pick, force push və filter-branch."
    nodes:
      - id: rebase
        title: "rebase"
        outcome: "Oxucu rebase-in commit-ləri yeni əsasın üstünə necə köçürdüyünü (yeni hash-larla) izah edə bilir."
        kind: state
        facets: [theory, practice, visual, test]
        requires: [three-way-merge]
        duration: 9
        topics: [Rebase, new commit hashes, rebase conflicts, --continue, --abort]
      - id: merge-vs-rebase
        title: "Merge və rebase"
        outcome: "Oxucu merge ilə rebase arasında seçimi tarixçə və komanda işi baxımından əsaslandıra bilir."
        kind: compare
        facets: [theory, visual, test, interview]
        requires: [rebase]
        duration: 7
        topics: [merge vs rebase, golden rule of rebasing]
      - id: linear-vs-non-linear
        title: "Xətti və qeyri-xətti tarixçə"
        outcome: "Oxucu xətti və qeyri-xətti tarixçənin üstünlüklərini müqayisə edib komandaya uyğun olanı seçə bilir."
        kind: compare
        facets: [theory, visual, test, interview]
        requires: [merge-vs-rebase, ff-vs-no-ff]
        duration: 6
        topics: [Linear vs Non-Linear, merge commits in history, readability vs context]
      - id: interactive-rebase
        title: "Interactive rebase"
        outcome: "Oxucu interactive rebase ilə commit-ləri birləşdirə, adını dəyişə və sırasını dəyişə bilir."
        kind: terminal
        facets: [theory, practice, test]
        requires: [rebase]
        duration: 9
