- question: "Yeni repository-də bu komandalardan sonra nə çap olunur?"
  code: |
    echo "milk" > list.txt
    git add list.txt
    git commit -q -m "Start list"
    git switch -q -c feature
    echo "eggs" >> list.txt
    git commit -q -am "Add eggs"
    echo "rice" >> list.txt
    git commit -q -am "Add rice"
    git switch -q main
    echo "tea" > drinks.txt
    git add drinks.txt
    git commit -q -m "Add drinks"
    git log --oneline main..feature
  options:
    - "Yalnız `Add drinks` commit-i"
    - "`Add rice` və `Add eggs` commit-ləri"
    - "`Add rice`, `Add eggs` və `Start list` commit-ləri"
  answer: 1
  explain: "`main..feature` `feature`-da olub `main`-də olmayan commit-ləri göstərir. `Start list` hər iki branch-dadır, `Add drinks` isə yalnız `main`-dədir."
- question: "`git log feature..main` hansı commit-ləri göstərir?"
  options:
    - "`feature`-da olub `main`-də olmayanları"
    - "Hər iki branch-ın bütün commit-lərini"
    - "`main`-də olub `feature`-da olmayanları"
  answer: 2
  explain: "`A..B` \"B-də var, A-da yox\" deməkdir. Burada B `main`-dir."
- question: "`git diff main..feature` hansı komanda ilə eyni nəticəni verir?"
  options:
    - "`git diff main feature`"
    - "`git diff main...feature`"
    - "`git log -p main..feature`"
  answer: 0
  explain: "`git diff`-də iki nöqtə boşluqla eynidir: hər ikisi iki branch-ın son snapshot-larını müqayisə edir."
- question: "Yeni repository-də bu komandalardan sonra nə çap olunur?"
