- question: "`feat/`, `fix/`, `hotfix/` kimi prefikslər haradan gəlir?"
  options:
    - "Komandanın razılaşmasıdır; Git üçün `/` adın adi simvoludur"
    - "Git onları tələb edir; prefikssiz ad xəta verir"
    - "Git onları `git switch -c` zamanı özü əlavə edir"
  answer: 0
  explain: "Git prefiksləri yoxlamır; hansı prefiksin işləndiyini komanda seçir, ona görə layihədən layihəyə fərqlənir."
- question: "Bu komanda nə çap edir?"
  code: |
    git check-ref-format --branch "gift cards"
  options:
    - "Boşluğu defislə əvəz edib `gift-cards` çap edir"
    - "Adı rədd edir: `'gift cards' is not a valid branch name`"
    - "`gift cards` adlı yeni branch yaradıb ona keçir"
  answer: 1
  explain: "`check-ref-format` adı yalnız yoxlayır: düzgün adı olduğu kimi çap edir, səhv ada `fatal` xətası verir. Branch yaratmır."
