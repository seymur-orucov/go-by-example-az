# Hand-written visuals (text lesson): the same history with bad and good messages, then the
# parts of one message.
why:
  vis:
    kind: compare
    caption: "Eyni dörd commit, `git log --oneline` (ən yenisi yuxarıda)"
    a: { title: "Pis mesajlar", sub: "bir ay sonra heç nə demir" }
    b: { title: "Yaxşı mesajlar", sub: "nə dəyişdiyi görünür" }
    rows:
      - aspect: "4-cü commit"
        a: "`update`"
        b: "`Cache forecast for ten minutes`"
        better: b
      - aspect: "3-cü commit"
        a: "`wip`"
        b: "`Show temperature in Fahrenheit`"
        better: b
      - aspect: "2-ci commit"
        a: "`fix`"
        b: "`Fix crash when city name is empty`"
        better: b
      - aspect: "1-ci commit"
        a: "`changes`"
        b: "`Add city search form`"
        better: b
    note: "Çıxışda hər sətrin əvvəlində qısa hash də olur; burada yalnız başlıqlar göstərilib."
