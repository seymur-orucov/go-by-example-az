- question: "Siyahıda `Add a` və `Add b` sətirlərinin yerini dəyişdiniz. Rebase-dən sonra nə olur?"
  options:
    - "Git sətirləri köhnə sıraya qaytarır"
    - "Commit-lər yeni sırada yazılır"
    - "Hər iki commit bir commit-ə birləşir"
  answer: 1
