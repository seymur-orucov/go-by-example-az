- question: "Siz `main`-dəsiniz və `git merge sale` konfliktlə dayandı. Faylda bu hissə var. `sale` branch-ında qiymət nədir?"
  code: |
    <<<<<<< HEAD
    Price: 6 USD
    =======
    Price: 4 USD
    >>>>>>> sale
  options:
    - "`6 USD`"
    - "`4 USD`"
    - "Markerlərdən bunu bilmək olmur"
  answer: 1
  explain: "`=======` ilə `>>>>>>> sale` arasında merge olunan branch-ın versiyası var. `<<<<<<< HEAD` hissəsi `main`-inkidir."
