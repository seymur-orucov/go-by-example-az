- question: "`feature` branch-ının commit-lərini `main`-ə gətirmək istəyirsiniz. Hansı komandalar lazımdır?"
  options:
    - "`git switch feature`, sonra `git merge main`"
    - "`git switch main`, sonra `git merge feature`"
    - "`git switch feature`, sonra `git merge feature`"
  answer: 1
  explain: "Merge hazırkı branch-a yazır. Əvvəlcə target-ə, yəni `main`-ə keçirsiniz, sonra source-u, `feature`-u adlandırırsınız."
- question: "Yeni repository-də bu komandalardan sonra çıxışın ikinci sətri nədir?"
  code: |
    echo "Baku" > tour.txt
    git add tour.txt
    git commit -q -m "Add Baku"
    git switch -q -c summer
    echo "Ganja" >> tour.txt
    git commit -q -am "Add Ganja"
    git switch -q main
    git merge summer
  options:
    - "`Fast-forward`"
    - "`Merge made by the 'ort' strategy.`"
    - "`Already up to date.`"
  answer: 0
  explain: "`main`-də ayrılandan sonra yeni commit yoxdur, ona görə Git `main`-i `summer`-in commit-inə irəli çəkir. Birinci sətir `Updating ...`-dir."
- question: "`main`-də `git merge summer` işlətdiniz. Merge-dən sonra `summer` branch-ına nə olur?"
  options:
    - "Avtomatik silinir"
    - "Olduğu commit-də qalır"
    - "`main`-in əvvəlki commit-inə keçir"
  answer: 1
  explain: "Merge yalnız hazırkı branch-ı, yəni target-i dəyişir. Source branch-a toxunmur."
- question: "Yeni repository-də bu komandalardan sonra çıxışın birinci sətri nədir?"
  code: |
    echo "Baku" > tour.txt
