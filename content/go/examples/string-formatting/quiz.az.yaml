- question: Bu kod nə çap edəcək?
  code: |
    fmt.Printf("%d", 1)
    fmt.Printf("%d", 2)
  options: ["1 2", "12", "1 və 2 ayrı sətirlərdə"]
  answer: 1
  explain: "`Printf` özü nə boşluq, nə də sətir keçidi qoyur; keçid lazımdırsa, format sətrinə `\n` yazılır."

- question: Bu kod nə çap edəcək?
  code: |
    type Seat struct {
        Row  int
        Zone string
    }
    fmt.Printf("%+v\n", Seat{4, "C"})
  options: ["{4 C}", "main.Seat{Row:4, Zone:\"C\"}", "{Row:4 Zone:C}"]
  answer: 2
  explain: "`%+v` struct-ı sahə adları ilə çap edir; `%v` `{4 C}`, `%#v` isə Go sintaksisi verərdi."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Printf("%T %T %T\n", 7, 7.0, "7")
  options: ["int float64 string", "int int string", "7 7 7"]
  answer: 0
  explain: "`%T` dəyərin tipini çap edir: tam literal `int`, nöqtəli literal `float64` olur."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Printf("%5.1f|\n", 9.876)
  options: ["9.876|", "  9.9|", "9.8  |"]
  answer: 1
  explain: "`.1` kəsrdən sonra bir rəqəm saxlayır və yuvarlaqlaşdırır, `5` isə nəticəni 5 simvolluq sahədə sağa düzləndirir."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Printf("[%-6s][%6s]\n", "tea", "tea")
  options: ["[   tea][tea   ]", "[tea][tea]", "[tea   ][   tea]"]
  answer: 2
  explain: "`-` mətni sola düzləndirir və boşluqları sağa qoyur; işarəsiz enlik isə sağa düzləndirir."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Printf("%x %02x %X\n", 255, 9, 171)
  options: ["ff 09 AB", "ff 9 AB", "FF 09 ab"]
  answer: 0
  explain: "`%x` kiçik, `%X` böyük hərflərlə hex yazır, `%02x` isə bir rəqəmli nəticəni sıfırla iki simvola tamamlayır."

- question: Bu kod nə çap edəcək?
  code: |
    s := fmt.Sprintf("%d%%", 40)
    fmt.Println(len(s))
  options: ["4", "3", "heç nə, çünki `Sprintf` çap etmir"]
  answer: 1
  explain: "`Sprintf` `\"40%\"` string-ini qaytarır: `%%` bir `%` simvolu verir, cəmi 3 simvol."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    fmt.Printf("%d\n", "ten")
  options:
    - "kompilyasiya xətası: `%d` string qəbul etmir"
    - "`0` çap olunur"
    - "`%!d(string=ten)` çap olunur"
  answer: 2
  explain: "Kompilyator format sətrini yoxlamır, `fmt` səhvi çıxışda göstərir; `go vet` isə bunu əvvəlcədən xəbər verir."
