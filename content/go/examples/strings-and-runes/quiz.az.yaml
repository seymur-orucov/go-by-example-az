- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(len("Rome"), len("Zürich"))
  options: ["4 6", "4 7", "8 12"]
  answer: 1
  explain: "`len` baytları sayır: `Rome` 4 bayt, `Zürich`-dəki `ü` 2 bayt tutduğu üçün 7 bayt."

- question: Bu kod nə çap edəcək?
  code: |
    s := "café"
    fmt.Println(len(s), utf8.RuneCountInString(s))
  options: ["4 4", "4 5", "5 4"]
  answer: 2
  explain: "`é` 2 bayt tutur: 5 bayt, amma 4 hərf."

- question: Bu kod nə çap edəcək?
  code: |
    s := "Rome"
    fmt.Println(s[0])
  options: ["82", "R", "\"R\""]
  answer: 0
  explain: "İndeks bayt qaytarır və `Println` onu ədəd kimi çap edir; `R`-nin kodu 82-dir."

- question: Bu kod nə çap edəcək?
  code: |
    r := []rune("Zürich")
    fmt.Println(len(r), string(r[1]))
  options: ["6 ü", "7 ü", "6 r"]
  answer: 0
  explain: "`[]rune` mətni hərflərə bölür: 6 hərf, 1-ci indeksdə `ü`."

- question: Bu kod nə çap edəcək?
  code: |
    for i := range "été" {
        fmt.Print(i, " ")
    }
  options: ["0 1 2 ", "1 2 3 ", "0 2 3 "]
  answer: 2
  explain: "`range` hərfin başladığı baytın indeksini verir; `é` 2 bayt tutduğu üçün indeks 0-dan 2-yə, sonra 3-ə atlayır."

- question: "`'a'` ilə `\"a\"` arasındakı fərq nədir?"
  options: ["Fərq yoxdur", "`'a'` rune-dur, `\"a\"` string-dir", "`'a'` string-dir, `\"a\"` rune-dur"]
  answer: 1
  explain: "Tək dırnaq rune literal, cüt dırnaq string literal yaradır."

- question: Hansı sətir kompilyasiya olunmayacaq?
  code: |
    s := "hi"
  options: ["b := s[0]", "s = \"ok\"", "s[0] = 'H'"]
  answer: 2
  explain: "String dəyişməzdir: baytını dəyişmək olmaz, amma dəyişənə yeni string yazmaq olar."

- question: Bu kod nə çap edəcək?
  code: |
    n := 0
    for _, r := range "Düsseldorf Zürich" {
        if r == 'ü' {
            n++
        }
    }
    fmt.Println(n)
  options: ["2", "1", "4"]
  answer: 0
  explain: "`range` hərf-hərf gəzir və hər `ü` bir dəfə sayılır."
