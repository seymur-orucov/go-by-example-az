- question: Bu kod nə çap edəcək?
  code: |
    floors := []int{30, 4, 112, 9}
    slices.Sort(floors)
    fmt.Println(floors)
  options: ["[4 9 30 112]", "[112 30 9 4]", "[112 30 4 9]"]
