nil:
  out: "boş: [] 0"
  vis: { kind: slice, name: s, nil: true, cells: [], len: 0, cap: 0 }
make:
  out: "make: [a b c] 3"
  vis: { kind: slice, name: s, cells: [a, b, c], len: 3, cap: 3 }
append:
  out: "append: [a b c d e] 5 6"
  vis: { kind: slice, name: s, cells: [a, b, c, d, e, ""], len: 5, cap: 6, fresh: [3, 4] }
slice:
  out: "kəsik: [b c]"
  vis: { kind: slice, name: "s[1:3]", cells: [a, b, c, d, e, ""], len: 2, cap: 5, window: [1, 3] }
literal:
  out: "qısa: [1 2 3]"
  vis: { kind: slice, name: t, cells: ["1", "2", "3"], len: 3, cap: 3 }
