- question: Bu kod nə çap edəcək?
  code: |
    var s []int
    fmt.Println(s == nil, len(s))
  options: ["false 0", "true 0", "true 1"]
  answer: 1
  explain: Dəyər verilməmiş slice `nil`-dir və uzunluğu 0-dır.

- question: Bu kod nə çap edəcək?
  code: |
    s := make([]int, 3)
    fmt.Println(s)
  options: ["[]", "[0 0 0]", "[nil nil nil]"]
  answer: 1
  explain: "`make` massivi tipin sıfır dəyəri ilə doldurur; `int` üçün bu 0-dır."

- question: Bu kod nə çap edəcək?
  code: |
    s := make([]int, 2, 5)
    fmt.Println(len(s), cap(s))
  options: ["2 5", "5 2", "2 2"]
  answer: 0
  explain: "`make`-in ikinci arqumenti uzunluq (`len`), üçüncüsü tutumdur (`cap`)."

- question: Bu kod nə çap edəcək?
  code: |
    var s []int
    s = append(s, 1)
    fmt.Println(s)
  options: ["[1]", "[]", "panic: nil slice"]
  answer: 0
  explain: "`nil` slice-a da `append` etmək olar: Go lazım olan massivi özü ayırır."

- question: Bu kod nə çap edəcək?
  code: |
    s := []int{10, 20, 30, 40}
    fmt.Println(s[1:3])
  options: ["[10 20 30]", "[20 30]", "[20 30 40]"]
  answer: 1
  explain: "`s[1:3]` 1-ci və 2-ci indeksləri götürür; 3-cü indeks daxil deyil."

- question: Bu kod nə çap edəcək?
  code: |
    a := []int{1, 2, 3}
    b := a[:2]
    b[0] = 9
    fmt.Println(a)
  options: ["[1 2 3]", "[9 2]", "[9 2 3]"]
  answer: 2
  explain: Kəsik eyni massivə baxır, ona görə `b` vasitəsilə edilən dəyişiklik `a`-da da görünür.

- question: Bu kod nə çap edəcək?
  code: |
    s := make([]int, 5)
    t := s[1:3]
    fmt.Println(len(t), cap(t))
  options: ["2 2", "2 4", "2 5"]
  answer: 1
  explain: Kəsiyin tutumu başlanğıc indeksdən massivin sonuna qədərdir — 5 − 1 = 4.

- question: Hansı sətir kompilyasiya olunmayacaq?
  options:
    - "s = append(s, 4)"
    - "append(s, 4)"
    - "s = append(s, 4, 5)"
  answer: 1
  explain: "`append` yeni slice qaytarır; nəticə istifadə olunmasa, kompilyator xəta verir."
