- question: Bu kod nə çap edəcək?
  code: |
    var s []int
    fmt.Println(len(s), s == nil)
  options: ["0 true", "0 false", "nil true"]
  answer: 0
  explain: Dəyər verilməmiş slice `nil`-dir və uzunluğu 0-dır.

- question: Bu kod nə çap edəcək?
  code: |
    var s []int
    s = append(s, 5, 7)
    fmt.Println(s, len(s))
  options: ["[5 7] 2", "[] 0", "panic: nil slice"]
  answer: 0
  explain: "`nil` slice-a da `append` etmək olar — Go lazım olan yeri özü ayırır."

- question: Bu kod nə çap edəcək?
  code: |
    n := make([]string, 2)
    fmt.Println(len(n), n[0] == "")
  options: ["0 true", "2 true", "2 false"]
  answer: 1
  explain: "`make` 2 element yaradır və onları zero value ilə doldurur; `string` üçün bu boş mətndir."

- question: Bu kod nə çap edəcək?
  code: |
    t := []int{1, 2, 3, 4}
    fmt.Println(t[1:3])
  options: ["[1 2 3]", "[2 3]", "[2 3 4]"]
  answer: 1
  explain: "1-ci indeks daxildir, 3-cü daxil deyil: `t[1]` və `t[2]`."

- question: Bu kod nə çap edəcək?
  code: |
    u := []int{1, 2, 3}
    v := u[:2]
    v[0] = 9
    fmt.Println(u)
  options: ["[1 2 3]", "[9 2]", "[9 2 3]"]
  answer: 2
  explain: "`v` `u`-nun elementlərinə baxır, kopya deyil; `v`-dəki dəyişiklik `u`-da da görünür."

- question: Bu kod nə çap edəcək?
  code: |
    m := make([]int, 2, 5)
    fmt.Println(len(m), cap(m))
  options: ["2 5", "5 2", "2 2"]
  answer: 0
  explain: "`make`-in ikinci arqumenti `len`, üçüncüsü `cap`-dir."

- question: Bu kod işə salınanda nə olacaq?
  code: |
    var c []int
    c[0] = 1
  options: ["c [1] olacaq", "proqram panic ilə dayanacaq", "kompilyasiya xətası"]
  answer: 1
  explain: "Boş slice-da 0-cı element yoxdur; əvvəlcə `append` ilə element əlavə etmək lazımdır."

- question: Hansı sətir kompilyasiya olunmayacaq?
  options: ["c = append(c, 1)", "append(c, 1)", "c = append(c, 1, 2)"]
  answer: 1
  explain: "`append` yeni slice qaytarır; nəticə istifadə olunmasa, kompilyator xəta verir."
