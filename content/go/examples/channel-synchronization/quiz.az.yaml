- question: Bu kod nə çap edəcək?
  code: |
    done := make(chan struct{})
    go func() {
        fmt.Println("report sent")
        done <- struct{}{}
    }()
    <-done
    fmt.Println("shift over")
  options: ["`report sent`, `shift over`", "`shift over`, `report sent`", "yalnız `shift over`"]
  answer: 0
  explain: "`<-done` goroutine siqnal göndərənə qədər gözləyir, siqnal isə çapdan sonra gəlir."

- question: Bu kod haqqında nə demək olar?
  code: |
    func main() {
        go func() {
            fmt.Println("saved")
        }()
        fmt.Println("closing")
    }
  options:
    - "`closing` mütləq çap olunur, `saved` isə çap olunmaya da bilər"
    - "hər iki sətir mütləq çap olunur"
    - "`saved` həmişə `closing`-dən əvvəl çap olunur"
  answer: 0
  explain: "`main` goroutine-i gözləmir və bitəndə proqram da bitir."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    done := make(chan struct{})
    go func() {
        fmt.Println("copying")
    }()
    <-done
  options:
    - "`copying` çap olunur, sonra proqram `deadlock` xətası ilə dayanır"
    - "`copying` çap olunur və proqram normal bitir"
    - "heç nə çap olunmur, proqram normal bitir"
  answer: 0
  explain: "Goroutine siqnal göndərmədən bitir, `<-done` isə heç vaxt gəlməyəcək dəyəri gözləyir."

- question: "`done` `chan struct{}` tiplidir. Hansı sətir kompilyasiya olunmur?"
  options: ["`done <- struct{}`", "`done <- struct{}{}`", "`<-done`"]
  answer: 0
  explain: "`struct{}` tipdir, dəyər deyil; dəyər `struct{}{}` kimi yazılır."

- question: Bu koddan hansı sətirlərin çap olunacağı dəqiq bəllidir?
  code: |
    done := make(chan bool)
    go func() {
        fmt.Println("step 1")
        done <- true
        fmt.Println("step 2")
    }()
    <-done
    fmt.Println("main")
  options:
    - "`step 1` və `main`; `step 2` çap olunmaya da bilər"
    - "hər üçü, məhz bu sıra ilə: `step 1`, `step 2`, `main`"
    - "yalnız `main`"
  answer: 0
  explain: "Siqnal işin ortasında göndərilib: ondan sonrakı kodu `main` gözləmir və proqram ondan əvvəl bitə bilər."

- question: Bu kodda nə səhvdir?
  code: |
    done := make(chan struct{})
    for _, shelf := range []string{"A", "B"} {
        go func() {
            fmt.Println("counted shelf", shelf)
            done <- struct{}{}
        }()
    }
    <-done
    fmt.Println("inventory over")
  options:
    - "`main` yalnız bir siqnal gözləyir, `inventory over` ikinci rəf sayılmadan çap oluna bilər"
    - "heç nə, `main` hər iki goroutine-i gözləyir"
    - "proqram mütləq `deadlock` xətası ilə dayanır"
  answer: 0
  explain: "Hər goroutine bir siqnal göndərir, ona görə iki goroutine üçün `<-done` iki dəfə yazılmalıdır."
