rules:
  - "Bir neçə nəticənin tipləri mötərizədə yazılır, `(int, bool)`, `return` də o qədər dəyər qaytarmalıdır."
  - "Nəticələri dəyişənlərə yazanda hər nəticəyə bir dəyişən lazımdır; lazım olmayanı `_` ilə atın."
  - "`:=` solda ən azı bir yeni dəyişən tələb edir; mövcud dəyişənlərə `=` ilə yazın."
  - "Adlı nəticələr zero value ilə başlayır, boş `return` onların cari dəyərini qaytarır."
  - "Çoxlu nəticəni birbaşa başqa funksiyaya ötürmək olar: `fmt.Println(split(50, 3))`."
practices:
  - "Uğuru və ya uğursuzluğu ayrıca `bool` nəticə ilə bildirin və onu `ok` adlandırın."
  - "Boş `return`-ü yalnız qısa funksiyalarda yazın; uzun funksiyada dəyərləri açıq qaytarın."
  - "Nəticələrin mənası tipdən görünmürsə, onlara ad verin: `(tax, total int)`."
