- question: Bu kod nə çap edəcək?
  code: |
    func hoursMinutes(total int) (int, int) {
        return total / 60, total % 60
    }

    h, m := hoursMinutes(135)
    fmt.Println(h, m)
  options: ["2 15", "2 25", "135 0"]
  answer: 0
  explain: "`135 / 60` tam bölmədə `2`, qalıq isə `15`-dir."

- question: Hansı sətir kompilyasiya olunmayacaq?
  code: |
    func pair() (int, string) {
        return 7, "seven"
    }
  options: ["`n, s := pair()`", "`n := pair()`", "`_, s := pair()`"]
  answer: 1
  explain: "`pair` iki dəyər qaytarır, solda isə bir dəyişən var."

- question: Bu kod nə çap edəcək?
  code: |
    func take(stock, n int) (int, bool) {
        if n > stock {
            return stock, false
        }
        return stock - n, true
    }

    left, ok := take(5, 7)
    fmt.Println(left, ok)
  options: ["-2 true", "5 false", "0 false"]
  answer: 1
  explain: "`7 > 5` olduğu üçün birinci `return` işləyir: anbar dəyişmir, `ok` `false` olur."

- question: Bu kod nə çap edəcək?
  code: |
    func hoursMinutes(total int) (int, int) {
        return total / 60, total % 60
    }

    _, m := hoursMinutes(200)
    fmt.Println(m)
  options: ["3", "200", "20"]
  answer: 2
  explain: "Saat `_` ilə atılır, `m` isə qalıq dəqiqələri, `200 % 60 = 20` saxlayır."

