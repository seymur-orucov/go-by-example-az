- question: Bu funksiya niyə kompilyasiya olunmur?
  code: |
    func area(w, h int) (int, int) {
        return w * h
    }
  options:
    - "nəticələrə ad verilməyib, ona görə `return` işləmir"
    - "`w * h` ifadəsi `int` deyil, ona görə qaytarmaq olmaz"
    - "iki nəticə elan olunub, `return` isə bir dəyər qaytarır"
  answer: 2
  explain: "`return` elanda olan qədər dəyər qaytarmalıdır, burada iki."

