- question: Bu kod nə çap edəcək?
  code: |
    var r Room // XMLName "room", Floor attr, Name `xml:"name"`
    err := xml.Unmarshal([]byte(`<room floor="5"><name>Iris</name><view>sea</view></room>`), &r)
    fmt.Println(r.Floor, r.Name, err)
  options: ["`0 Iris <nil>`", "`5 Iris unknown element view`", "`5 Iris <nil>`"]
  answer: 2
  explain: "Atribut da, element də tag-lara görə oxunur, struct-da olmayan `<view>` isə səssizcə atılır."

- question: "`xml.MarshalIndent` nəticəsi `<?xml version=\"1.0\" ...?>` başlığı ilə başlayırmı?"
  options: ["Bəli", "Xeyr", "Yalnız `XMLName` sahəsi olanda"]
  answer: 1
  explain: "`Marshal` və `MarshalIndent` yalnız elementləri yazır. Başlıq lazımdırsa, `xml.Header`-i əvvələ özümüz əlavə edirik."

- question: Bu kod nə çap edəcək?
  code: |
    type Room struct {
        XMLName xml.Name `xml:"room"`
        Note    string   `xml:"note,omitempty"`
    }

    b, _ := xml.Marshal(Room{})
    fmt.Println(string(b))
  options: ["`<room><note></note></room>`", "`<room/>`", "`<room></room>`"]
  answer: 2
  explain: "`omitempty` XML-də də JSON-dakı kimi işləyir: boş `Note` yazılmır, boş element isə `<room></room>` kimi çıxır."
