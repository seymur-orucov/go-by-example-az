- question: Bu kod nə çap edəcək?
  code: |
    type Room struct {
        XMLName xml.Name `xml:"room"`
        Tags    []string `xml:"tag"`
    }

    b, _ := xml.Marshal(Room{Tags: []string{"quiet", "sea view"}})
    fmt.Println(string(b))
  options:
    - "`<room><tag>quiet sea view</tag></room>`"
    - "`<room><tags><tag>quiet</tag><tag>sea view</tag></tags></room>`"
    - "`<room tag=\"quiet,sea view\"></room>`"
    - "`<room><tag>quiet</tag><tag>sea view</tag></room>`"
  answer: 3
  explain: "Slice-ın hər elementi ayrıca `<tag>` elementi olur, onları əhatə edən element əlavə olunmur."

