- question: Bu kod nə çap edəcək?
  code: |
    type Room struct {
        XMLName xml.Name `xml:"room"`
        Floor   int      `xml:"floor,attr"`
        Name    string   `xml:"name"`
    }

    b, _ := xml.Marshal(Room{Floor: 3, Name: "Lotus"})
    fmt.Println(string(b))
  options:
    - "`<room><floor>3</floor><name>Lotus</name></room>`"
    - "`<room floor=\"3\"><name>Lotus</name></room>`"
    - "`<Room floor=\"3\"><name>Lotus</name></Room>`"
  answer: 1
  explain: "`,attr` sahəni atribut edir, kök elementin adını isə `XMLName` tag-ı verir."

