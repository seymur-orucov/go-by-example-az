  options: ["`receipt.pdf`", "`receipt.pdf3815204967`", "`3815204967receipt.pdf`"]
  answer: 1
  explain: "`*` olmayanda təsadüfi hissə adın sonuna əlavə olunur, ona görə genişlənmə də pozulur."

