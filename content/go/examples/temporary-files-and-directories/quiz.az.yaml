- question: "Müvəqqəti qovluğa fayllar yazılacaq. `MkdirTemp`-dən dərhal sonra hansı sətir yazılmalıdır?"
  options:
    - "`defer os.Remove(dir)`"
    - "`defer os.TempDir()`"
    - "`defer f.Close()`"
    - "`defer os.RemoveAll(dir)`"
  answer: 3
  explain: "`os.Remove` içində fayl olan qovluğu silmir; hamısını `os.RemoveAll` silir."

- question: Bu proqram bitəndə müvəqqəti qovluq silinəcəkmi?
  code: |
    dir, _ := os.MkdirTemp("", "job-*")
    defer os.RemoveAll(dir)
    os.Exit(0)
  options: ["Xeyr, `os.Exit` `defer`-ləri işlətmir", "Bəli, `defer` həmişə işləyir"]
  answer: 0
  explain: "`os.Exit` proqramı dərhal bitirir və `defer` ilə gecikdirilmiş çağırışlar işləmir."

- question: Bu kod nə çap edəcək?
  code: |
    os.WriteFile("price.txt", []byte("10"), 0o644)
    os.WriteFile("price.tmp", []byte("12"), 0o644)
    os.Rename("price.tmp", "price.txt")
    b, _ := os.ReadFile("price.txt")
    fmt.Println(string(b))
  options: ["`10`", "`12`", "fayl artıq var xətası"]
  answer: 1
  explain: "`os.Rename` hədəfdə olan faylı yenisi ilə əvəz edir."
