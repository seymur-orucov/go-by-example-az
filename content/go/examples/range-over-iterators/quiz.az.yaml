- question: Bu kod hansı sıra ilə çap edəcək?
  code: |
    func Loud() iter.Seq[int] {
        return func(yield func(int) bool) {
            fmt.Println("start")
            yield(7)
        }
    }

    s := Loud()
    fmt.Println("created")
    for x := range s {
        fmt.Println(x)
    }
  options: ["start, created, 7", "start, 7, created", "created, start, 7"]
  answer: 2
  explain: "`Loud()` yalnız funksiya qaytarır; onun kodu `range` başlayanda işləyir."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    func Twice() iter.Seq[int] {
        return func(yield func(int) bool) {
            yield(1)
            yield(2)
        }
    }

    for x := range Twice() {
        fmt.Println(x)
        break
    }
  options: ["`1` çap olunur, sonra panic", "yalnız `1` çap olunur", "`1` və `2` çap olunur"]
  answer: 0
  explain: "`break`-dən sonra `yield` `false` qaytarır, iterator isə onu yoxlamadan yenə çağırır."

