- question: Bu kod nə çap edəcək?
  code: |
    func Countdown(n int) iter.Seq[int] {
        return func(yield func(int) bool) {
            for i := n; i > 0; i-- {
                if !yield(i) {
                    return
                }
            }
        }
    }

    for x := range Countdown(3) {
        fmt.Print(x)
    }
  options: ["123", "321", "3210"]
  answer: 1
  explain: "Iterator `3`, `2`, `1` dəyərlərini verir, `i > 0` şərti `0`-ı buraxmır."

- question: Bu kod nə çap edəcək?
  code: |
    for x := range Countdown(5) {
        if x == 3 {
            break
        }
        fmt.Print(x)
    }
  options: ["543", "21", "54"]
  answer: 2
  explain: "`x` `3` olanda `break` dövrü bitirir, `yield` `false` qaytarır və iterator dayanır."

