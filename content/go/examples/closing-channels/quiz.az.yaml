- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan int, 2)
    ch <- 7
    close(ch)
    v1, ok1 := <-ch
    v2, ok2 := <-ch
    fmt.Println(v1, ok1, v2, ok2)
  options: ["7 true 0 false", "0 false 0 false", "7 true 7 false"]
  answer: 0
  explain: "Bağlanmadan əvvəl göndərilən `7` yenə qəbul olunur, channel boşalandan sonra isə zero value və `false` gəlir."

- question: Bu kod nə çap edəcək?
  code: |
    names := make(chan string)
    close(names)
    name, ok := <-names
    fmt.Println(name == "", ok)
  options: ["false false", "true false", "heç nə, proqram `deadlock` xətası ilə dayanır"]
  answer: 1
  explain: "Bağlı channel-dan qəbul bloklanmır və `string`-in zero value-sunu, yəni boş mətni qaytarır."

- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan int, 3)
    ch <- 3
    ch <- 0
    ch <- 4
    close(ch)
    for {
        v := <-ch
        if v == 0 {
            break
        }
        fmt.Print(v, " ")
    }
  options: ["3 4", "3 0 4", "3"]
  answer: 2
  explain: "`0` həqiqi göndərilmiş dəyərdir, amma dövr onu bağlanma kimi qəbul edir; yoxlama `ok` ilə olmalıdır."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    ch := make(chan int, 1)
    close(ch)
    ch <- 1
  options: ["panic: `send on closed channel`", "`1` buffer-ə yazılır, çünki yer var", "heç nə olmur"]
  answer: 0
  explain: "Bağlı channel-a göndərmək həmişə panic-dir, buffer-də yer olsa belə."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    ch := make(chan int)
    close(ch)
    close(ch)
  options: ["ikinci `close` heç nə etmir", "panic: `close of closed channel`", "kompilyasiya xətası"]
  answer: 1
  explain: "Channel yalnız bir dəfə bağlana bilər; ikinci `close` işləmə zamanı panic edir."

- question: Bu funksiya kompilyasiya olunurmu?
  code: |
    func reader(in <-chan int) {
        close(in)
    }
  options:
    - "Bəli"
    - "Bəli, amma işə düşəndə panic edir"
    - "Xeyr, kompilyasiya xətası verir"
  answer: 2
  explain: "`in` receive-only channel-dır. Bağlamaq göndərənin işidir, ona görə kompilyator qəbul edən tərəfə buna icazə vermir: `cannot close receive-only channel`."

- question: Channel-ı adətən kim bağlamalıdır?
  options:
    - "qəbul edən, bütün dəyərləri oxuyandan sonra"
    - "göndərən, son dəyəri göndərəndən sonra"
    - "fərqi yoxdur, hansı goroutine birinci bitirsə"
  answer: 1
  explain: "Daha dəyər olmayacağını yalnız göndərən bilir. Qəbul edən bağlasa, göndərən sonrakı göndərişdə panic edə bilər."
