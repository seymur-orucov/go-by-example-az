- question: Bu kod nə çap edəcək?
  code: |
    city := "baku"
    strings.ToUpper(city)
    fmt.Println(city)
  options: ["BAKU", "baku", "kompilyasiya xətası: nəticə istifadə olunmayıb"]
  answer: 1
  explain: "String dəyişməzdir: `ToUpper` yeni string qaytarır, nəticə isə heç yerə yazılmayıb."

- question: Bu kod nə çap edəcək?
  code: |
    file := "report-2026.pdf"
    fmt.Println(strings.HasPrefix(file, "report"), strings.HasSuffix(file, ".PDF"))
  options: ["true true", "false true", "true false"]
  answer: 2
  explain: "`HasSuffix` hərf registrini nəzərə alır: `.pdf` ilə `.PDF` fərqli sətirlərdir."

