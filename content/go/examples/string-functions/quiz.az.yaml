    words := strings.Fields("  pay   at   the desk ")
    fmt.Println(len(words), strings.Join(words, "_"))
  options:
    - "4 pay_at_the_desk"
    - "8 __pay___at___the_desk_"
    - "4 _pay_at_the_desk_"
  answer: 0
  explain: "`Fields` ardıcıl boşluqları bir ayırıcı sayır və kənarlardakı boşluqları atır."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(strings.Trim("--sale--off--", "-"))
  options: ["saleoff", "sale--off--", "sale--off"]
  answer: 2
  explain: "`Trim` simvolları yalnız iki kənardan atır, ortadakı tirelərə toxunmur."

- question: Bu kod nə çap edəcək?
  code: |
    date := "2026.11.26"
    fmt.Println(strings.Replace(date, ".", "/", 1), strings.Replace(date, ".", "/", -1))
  options:
    - "2026/11/26 2026/11/26"
    - "2026/11.26 2026.11.26"
    - "2026.11/26 2026/11/26"
    - "2026/11.26 2026/11/26"
  answer: 3
  explain: "`1` yalnız birinci rastlaşmanı əvəz edir, `-1` isə hamısını, `ReplaceAll` kimi."

- question: Bu kod nə çap edəcək?
