- question: Bu kod nə çap edəcək?
  code: |
    parts := strings.Split("tea,,milk", ",")
    fmt.Println(len(parts))
  options: ["2", "3", "4"]
  answer: 1
  explain: "İki vergül arasında boş sətir var, o da ayrıca element olur: `tea`, boş sətir, `milk`."

- question: Bu kod nə çap edəcək?
