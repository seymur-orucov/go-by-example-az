    fmt.Println(strings.Repeat("ab", 3), strings.EqualFold("Go", "GO"))
  options: ["ababab true", "ab3 true", "ababab false"]
  answer: 0
  explain: "`Repeat` mətni 3 dəfə yan-yana yazır, `EqualFold` isə hərf registrinə baxmır."

- question: Bu kod nə çap edəcək?
  code: |
    guests := []string{"omar", "Lena", "bruno"}
    slices.SortFunc(guests, func(a, b string) int {
        return cmp.Compare(strings.ToLower(a), strings.ToLower(b))
    })
    fmt.Println(guests)
  options: ["[Lena bruno omar]", "[bruno Lena omar]", "[bruno omar Lena]"]
  answer: 1
