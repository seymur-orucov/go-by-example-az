    kind: map
    name: stock
    entries: { flour: 30, honey: 8, milk: 7 }
    lookup: { key: butter, value: 0, ok: false }
delete:
  out: "stock: map[honey:8 milk:7] 2"
  vis: { kind: map, name: stock, entries: { honey: 8, milk: 7 }, gone: [flour] }
make:
  out: "sold: map[honey:1 milk:2]"
