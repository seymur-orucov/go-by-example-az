- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println("1" + "2")
  options: ["3", "12", "kompilyasiya xətası"]
  answer: 1
  explain: Dırnaq içindəki `"1"` ədəd yox, mətndir; `+` mətnləri birləşdirir.

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(9 / 2)
  options: ["4.5", "4", "5"]
  answer: 1
  explain: İki tam ədədin bölünməsi tam ədəd verir, kəsr hissə atılır.

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(9.0 / 2)
  options: ["4", "4.5", "4.0"]
  answer: 1
  explain: "`9.0` kəsr ədəddir, ona görə nəticə də kəsr olur."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(true && !false)
  options: ["true", "false"]
  answer: 0
  explain: "`!false` → `true`; `true && true` → `true`."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(false || false)
  options: ["true", "false"]
  answer: 1
  explain: "`||` ən azı bir tərəf `true` olanda `true` verir; burada ikisi də `false`-dur."

- question: Hansı ifadə kompilyasiya olunmayacaq?
  options: ['"a" + "b"', '"a" + 1', "1 + 2"]
  answer: 1
  explain: Go tipləri özü çevirmir — mətnlə ədədi toplamaq olmaz.
