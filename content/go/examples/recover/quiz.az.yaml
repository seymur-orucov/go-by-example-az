- question: Bu kod hansı sıra ilə çap edəcək?
  code: |
    func safe() {
        defer func() {
            fmt.Println("recovered:", recover())
        }()
        panic("boom")
    }

    safe()
    fmt.Println("after")
  options: ["yalnız panic mesajı", "`after`, `recovered: boom`", "`recovered: boom`, `after`"]
  answer: 2
  explain: "Defer panic-i tutur, `safe` normal bitir və `main` davam edir."

- question: Bu kod nə çap edəcək?
  code: |
    func calm() {
        defer func() {
            fmt.Println("r:", recover())
        }()
        fmt.Println("work")
    }

    calm()
  options: ["`r: <nil>`, `work`", "`work`, `r: <nil>`", "yalnız `work`"]
  answer: 1
  explain: "Panic olmayanda `recover` `nil` qaytarır, defer isə yenə funksiyanın sonunda işləyir."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    func try() {
        if r := recover(); r != nil {
            fmt.Println("caught")
        }
        panic("boom")
    }

    try()
  options: ["proqram panic ilə dayanır", "`caught` çap olunur", "heç nə çap olunmur, proqram normal bitir"]
  answer: 0
  explain: "`recover` defer-siz, panic-dən əvvəl çağırılıb və heç nə tutmur."

- question: "`helper` funksiyası `recover()` çağırıb nəticəni çap edir. Hansı yazılış panic-i tutur?"
  code: |
    func helper() {
        if r := recover(); r != nil {
            fmt.Println("caught", r)
        }
    }
  options:
    - "hər ikisi"
    - "`defer func() { helper() }()`"
    - "`defer helper()`"
  answer: 2
  explain: "`recover` birbaşa defer olunan funksiyada işləyir; ikinci halda defer olunan funksiya literal-dır, `helper` isə onun çağırdığı funksiyadır."

- question: Bu kod nə çap edəcək?
  code: |
    func div(a, b int) (res int, err error) {
        defer func() {
            if r := recover(); r != nil {
                err = errors.New("bad input")
            }
        }()
        return a / b, nil
    }

    fmt.Println(div(6, 0))
  options: ["panic mesajı", "0 bad input", "0 <nil>"]
  answer: 1
  explain: "Sıfıra bölmə panic edir, defer onu tutur və adlı nəticə `err`-ə xəta yazır."

- question: Bu kod nə çap edəcək?
  code: |
    func job() {
        defer fmt.Print("A")
        defer func() {
            recover()
            fmt.Print("B")
        }()
        panic("x")
    }

    job()
    fmt.Print("C")
  options: ["BAC", "ABC", "BA, sonra panic mesajı"]
  answer: 0
  explain: "Defer-lər tərs sıra ilə işləyir, ikincisi panic-i tutur və `main` `C`-ni çap edir."
