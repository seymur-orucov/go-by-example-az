- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan int, 2)
    ch <- 10
    ch <- 20
    fmt.Println(<-ch, <-ch)
  options: ["20 10", "10 20", "`fatal error: all goroutines are asleep - deadlock!`"]
  answer: 1
  explain: "Buffer-də iki dəyərə yer var, göndərmələr gözləmir, dəyərlər isə göndərildiyi sırada çıxır."

- question: Bu kod nə çap edəcək?
  code: |
    tasks := make(chan string, 4)
    tasks <- "wash"
    tasks <- "dry"
    <-tasks
    fmt.Println(len(tasks), cap(tasks))
  options: ["1 4", "2 4", "1 3"]
  answer: 0
  explain: "`len` buffer-də qalan dəyərləri sayır, `cap` isə tutumdur və dəyişmir."

- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan int, 1)
    ch <- 1
    ch <- 2
    fmt.Println("done")
  options: ["done", "`done`, sonra deadlock xətası", "`fatal error: all goroutines are asleep - deadlock!`"]
  answer: 2
  explain: "İkinci göndərmə dolu buffer-də yer gözləyir, onu boşaldan isə yoxdur."

- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan int, 3)
    fmt.Println(<-ch)
  options: ["0", "`fatal error: all goroutines are asleep - deadlock!`", "kompilyasiya xətası"]
  answer: 1
  explain: "Boş buffered channel-dan almaq dəyər gələnə qədər gözləyir, göndərən isə yoxdur."

- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan string)
    fmt.Println(len(ch), cap(ch))
  options: ["0 1", "0 0", "1 1"]
  answer: 1
  explain: "Ölçüsüz yaradılan channel buffer-sizdir, onun tutumu 0-dır."

- question: Hansı `ch` ilə bu kod goroutine-siz işləyir?
  code: |
    ch <- "draft"
    fmt.Println(<-ch)
  options: ["`ch := make(chan string)`", "`ch := make(chan string, 1)`", "hər ikisi"]
  answer: 1
  explain: "Buffer-də yer olanda göndərmə qəbul edəni gözləmir; buffer-siz channel-da isə `main` göndərmədə ilişib qalır."

- question: Bu kod nə çap edəcək?
  code: |
    ch := make(chan string, 2)
    go func() {
        ch <- "first"
        ch <- "second"
        ch <- "third"
    }()
    time.Sleep(100 * time.Millisecond)
    fmt.Println(len(ch))
  options: ["3", "2", "0"]
  answer: 1
  explain: "İki dəyər buffer-ə sığır, üçüncü göndərmə isə yer açılana qədər goroutine-də gözləyir."
