- question: Bu kod nə çap edəcək?
  code: |
    quote := make(chan string, 1)
    go func() {
        time.Sleep(100 * time.Millisecond)
        quote <- "taxi: 12 USD"
    }()
    select {
    case q := <-quote:
        fmt.Println(q)
    case <-time.After(300 * time.Millisecond):
        fmt.Println("no quote")
    }
  options: ["no quote", "taxi: 12 USD", "əvvəl `taxi: 12 USD`, sonra `no quote`"]
  answer: 1
  explain: "Cavab 100 ms-də, limit isə 300 ms-də hazır olur; `select` birincini seçir və bitir."

