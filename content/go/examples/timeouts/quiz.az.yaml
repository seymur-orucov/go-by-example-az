- question: "`time.After(200 * time.Millisecond)` nə qaytarır?"
  options:
    - "200 ms gözləyib `true` qaytarır"
    - "heç nə, `time.Sleep` kimi goroutine-i saxlayır"
    - "channel; 200 ms keçəndə ona bir dəyər göndərilir"
  answer: 2
  explain: "`time.After` dərhal channel qaytarır, ona görə onu `select`-in `case`-ində gözləmək olur."

- question: Bu kod nə çap edəcək?
  code: |
    deadline := time.After(250 * time.Millisecond)
    for i := 1; i <= 5; i++ {
        select {
        case <-deadline:
            fmt.Println("stopped at", i)
            return
        case <-time.After(100 * time.Millisecond):
            fmt.Println("box", i, "packed")
        }
    }
  options:
    - "`box 1 packed`, `box 2 packed`, `stopped at 3`"
    - "`box 1` ... `box 5 packed`, beş sətir"
    - "`stopped at 1`"
  answer: 0
  explain: "`deadline` bir dəfə yaradılıb və 250 ms-də hazır olur; hər qutu isə 100 ms çəkir, ona görə üçüncüsü bitmir."

- question: "Əvvəlki kodda `case <-deadline:` yerinə `case <-time.After(250 * time.Millisecond):` yazsaq, nə çap olunacaq?"
  options:
    - "`box 1 packed`, `box 2 packed`, `stopped at 3`"
    - "`box 1 packed` ... `box 5 packed`, beş sətir"
    - "`stopped at 1`"
  answer: 1
  explain: "Hər təkrarda yeni 250 ms-lik timer yaranır, 100 ms-lik isə həmişə ondan əvvəl hazır olur."

