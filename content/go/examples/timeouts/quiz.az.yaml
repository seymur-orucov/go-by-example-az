- question: Bu kod nə çap edəcək?
  code: |
    refund := make(chan string, 1)
    go func() {
        time.Sleep(300 * time.Millisecond)
        refund <- "refunded"
    }()
    select {
    case r := <-refund:
        fmt.Println(r)
    case <-time.After(100 * time.Millisecond):
        fmt.Println("still waiting")
    }
    fmt.Println(<-refund)
  options:
    - "`still waiting`"
    - "`refunded`"
    - "`still waiting`, sonra `refunded`"
  answer: 2
  explain: "Timeout yalnız `select`-i bitirir; goroutine işini davam etdirir və son sətir onun cavabını gözləyib oxuyur."
