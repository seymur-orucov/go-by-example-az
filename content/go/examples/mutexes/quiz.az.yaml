- question: "Bilet satmaq üçün niyə `atomic.Int64` yetmir, mutex lazımdır?"
  options:
    - "Atomik tiplər goroutine-lər arasında işləmir"
    - "Yeri yoxlamaq və satmaq iki addımdır, ikisi birlikdə qorunmalıdır"
    - "Atomik sayğac yalnız artırır, azaltmağı bilmir"
  answer: 1
  explain: "Atomik əməliyyat bir dəyəri bölünməz dəyişir, iki addımın arasına isə başqa goroutine girə bilər; mutex bütün hissəni bağlayır."

- question: Bu kod nə çap edəcək?
  code: |
    var mu sync.Mutex
    views := map[string]int{}
    var wg sync.WaitGroup
    for range 4 {
        wg.Go(func() {
            for range 250 {
                mu.Lock()
                views["home"]++
                mu.Unlock()
            }
        })
    }
    wg.Wait()
    fmt.Println(views["home"])
  options: ["250", "1000 və ya daha az, hər dəfə fərqli", "1000"]
  answer: 2
  explain: "Hər artım kilidin içindədir, ona görə dörd goroutine-in 1000 artımından heç biri itmir."

- question: Bu metodda nə səhvdir?
  code: |
    type Cart struct {
        mu    sync.Mutex
        items map[string]int
    }

    func (c Cart) Add(item string) {
        c.mu.Lock()
        defer c.mu.Unlock()
        c.items[item]++
    }
  options:
    - "Receiver value-dur: hər çağırış mutex-in kopyasını kilidləyir"
    - "`defer` ilə `Unlock` çağırmaq olmaz, kilid açılmır"
    - "Heç nə səhv deyil, kod düzgün işləyir"
  answer: 0
  explain: "Map hamı üçün eynidir, kilidlər isə kopyadır; `go vet` `Add passes lock by value` deyir, düzgünü `func (c *Cart)`-dır."

- question: Bu kod nə çap edəcək?
  code: |
    type Hall struct {
        mu    sync.Mutex
        taken map[string]bool
    }

    func (h *Hall) Book(seat string) bool {
        h.mu.Lock()
        if h.taken[seat] {
            return false
        }
        h.taken[seat] = true
        h.mu.Unlock()
        return true
    }

    h := &Hall{taken: map[string]bool{}}
    fmt.Println(h.Book("4A"))
    fmt.Println(h.Book("4A"))
    fmt.Println(h.Book("5B"))
  options:
    - "`true`, `false`, `true`"
    - "`true`, `false`, sonra deadlock xətası"
    - "`true`, sonra deadlock xətası"
  answer: 1
  explain: "İkinci çağırış `Unlock` etmədən qayıdır, üçüncü `Lock` isə əbədi gözləyir və Go `fatal error: all goroutines are asleep - deadlock!` ilə dayanır. `defer h.mu.Unlock()` bunun qarşısını alardı."

- question: Bu kod nə çap edəcək?
  code: |
    var mu sync.Mutex
    mu.Lock()
    mu.Lock()
    fmt.Println("done")
  options: ["`done` çap edir", "kompilyasiya xətası verir", "deadlock xətası ilə dayanır"]
  answer: 2
  explain: "Go-nun mutex-i eyni goroutine-ə ikinci dəfə `Lock` etməyə icazə vermir: ikinci `Lock` birincinin açılmasını gözləyir, onu isə açan yoxdur. Proqram `fatal error: all goroutines are asleep - deadlock!` ilə dayanır."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    var mu sync.Mutex
    fmt.Println("start")
    mu.Unlock()
    fmt.Println("end")
  options:
    - "`start`, sonra fatal error"
    - "`start`, `end`"
    - "kompilyasiya xətası"
  answer: 0
  explain: "Bağlanmamış mutex-i açmaq proqramı `fatal error: sync: unlock of unlocked mutex` ilə dayandırır, `recover` onu tutmur."

- question: "Bir goroutine `sync.RWMutex`-də `RLock` tutub. Başqa goroutine `Lock` çağırsa, nə olacaq?"
  options:
    - "dərhal keçəcək, çünki oxucu yazana mane olmur"
    - "`RUnlock` çağırılana qədər gözləyəcək"
    - "panic olacaq, çünki kilid artıq tutulub"
  answer: 1
  explain: "Oxucular bir-birinə mane olmur, amma yazan bütün oxucular çıxana qədər gözləyir."
