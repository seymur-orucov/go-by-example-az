- question: "Bilet satmaq üçün niyə `atomic.Int64` yetmir, mutex lazımdır?"
  options:
    - "Yerin boş olduğunu yoxlamaq və onu yazmaq iki addımdır və birlikdə qorunmalıdır"
    - "Atomik tiplər goroutine-lərdə işləmir"
    - "Atomik sayğac yalnız artırır, azaltmır"
  answer: 0
  explain: "Atomik əməliyyat bir dəyəri bölünməz dəyişir, iki addımın arasına isə başqa goroutine girə bilər; mutex bütün hissəni bağlayır."

- question: Bu kod nə çap edəcək?
  code: |
    var mu sync.Mutex
    views := map[string]int{}
    var wg sync.WaitGroup
    for range 4 {
        wg.Go(func() {
            for range 250 {
                mu.Lock()
                views["home"]++
                mu.Unlock()
            }
        })
    }
    wg.Wait()
    fmt.Println(views["home"])
  options: ["1000", "250", "1000 və ya daha az, hər dəfə fərqli"]
  answer: 0
  explain: "Hər artım kilidin içindədir, ona görə dörd goroutine-in 1000 artımından heç biri itmir."

- question: Bu metodda nə səhvdir?
  code: |
    type Cart struct {
        mu    sync.Mutex
        items map[string]int
    }

    func (c Cart) Add(item string) {
        c.mu.Lock()
        defer c.mu.Unlock()
        c.items[item]++
    }
  options:
    - "Receiver value-dur: hər çağırış mutex-in kopyasını kilidləyir və map qorunmur"
    - "`defer` ilə `Unlock` çağırmaq olmaz"
    - "Heç nə, kod düzgündür"
  answer: 0
  explain: "Map hamı üçün eynidir, kilidlər isə kopyadır; `go vet` `Add passes lock by value` deyir, düzgünü `func (c *Cart)`-dır."

- question: Bu kod nə çap edəcək?
  code: |
    type Hall struct {
        mu    sync.Mutex
        taken map[string]bool
    }

    func (h *Hall) Book(seat string) bool {
        h.mu.Lock()
        if h.taken[seat] {
            return false
        }
        h.taken[seat] = true
        h.mu.Unlock()
        return true
    }

    h := &Hall{taken: map[string]bool{}}
    fmt.Println(h.Book("4A"))
    fmt.Println(h.Book("4A"))
    fmt.Println(h.Book("5B"))
  options:
    - "`true`, `false`, sonra `fatal error: all goroutines are asleep - deadlock!`"
    - "`true`, `false`, `true`"
    - "`true`, sonra deadlock xətası"
  answer: 0
  explain: "İkinci çağırış `Unlock` etmədən qayıdır, üçüncü `Lock` isə əbədi gözləyir; `defer h.mu.Unlock()` bunun qarşısını alardı."

- question: Bu kod nə çap edəcək?
  code: |
    var mu sync.Mutex
    mu.Lock()
    mu.Lock()
    fmt.Println("done")
  options: ["`fatal error: all goroutines are asleep - deadlock!`", "done", "kompilyasiya xətası"]
  answer: 0
  explain: "Go-da mutex təkrar bağlanmır: ikinci `Lock` birincinin açılmasını gözləyir, onu isə açan yoxdur."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    var mu sync.Mutex
    fmt.Println("start")
    mu.Unlock()
    fmt.Println("end")
  options:
    - "`start`, sonra `fatal error: sync: unlock of unlocked mutex`"
    - "`start`, `end`"
    - "kompilyasiya xətası"
  answer: 0
  explain: "Bağlanmamış mutex-i açmaq proqramı dayandıran xətadır, `recover` onu tutmur."

