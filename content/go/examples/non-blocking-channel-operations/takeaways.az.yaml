rules:
  - "`default`-lu `select` gözləmir: heç bir `case` dərhal hazır deyilsə, `default` işləyir."
  - "`default` yalnız heç bir `case` hazır olmayanda seçilir, hazır `case` həmişə ondan üstündür."
  - "Bloklamayan qəbul channel boşdursa, bloklamayan göndərmə isə buffer doludursa (və ya qəbul edən yoxdursa) `default`-a keçir."
  - "`select`-in içindəki `break` yalnız `select`-dən çıxır; dövrü bitirmək üçün etiketli `break` lazımdır."
practices:
  - "Dövrü dayanmadan işləməli olan kodda (oyun kadrı, UI) mesajı `default`-lu `select` ilə yoxlayın."
  - "Dolu növbəyə göndərəndə nə edəcəyinizi açıq seçin: gözləmək, yoxsa `default`-da atmaq."
  - "Channel-ı boşaltmaq üçün `len`-ə baxıb sonra oxumaq əvəzinə `default`-lu `select` istifadə edin."
