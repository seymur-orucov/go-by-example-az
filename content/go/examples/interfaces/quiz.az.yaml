- question: Bu kod niyə kompilyasiya olunmur?
  code: |
    type Pricer interface {
        Price() int
        Name() string
    }

    type Tea struct{}

    func (t Tea) Price() int {
        return 3
    }

    var p Pricer = Tea{}
  options:
    - "`Tea`-də `Name` metodu yoxdur"
    - "`Tea` `implements Pricer` yazmalıdır"
    - "boş struct interface-ə yazıla bilməz"
  answer: 0
  explain: "Interface-i ödəmək üçün tipdə onun bütün metodları olmalıdır."

- question: "`Tick` metodu `func (c *Clock) Tick()` kimi yazılıb, `Ticker` interface-i isə `Tick()` tələb edir. Hansı sətir kompilyasiya olunur?"
  options:
    - "`var t Ticker = &Clock{}`"
    - "`var t Ticker = Clock{}`"
    - "hər ikisi"
  answer: 0
  explain: "Metod pointer receiver ilədir, ona görə interface-i yalnız `*Clock` ödəyir."

- question: Bu kod nə çap edəcək?
  code: |
    var s Shipping
    fmt.Println(s == nil)
  options: ["true", "false", "kompilyasiya xətası"]
  answer: 0
  explain: "Heç bir dəyər yazılmamış interface dəyişəni `nil`-dir."

- question: Bu kod nə çap edəcək?
  code: |
    c := Courier{PerKg: 2}
    var s Shipping = c
    c.PerKg = 10
    fmt.Println(s.Price(1))
  options: ["2", "10", "kompilyasiya xətası"]
  answer: 0
  explain: "Interface dəyişəni `c`-nin surətini saxlayır, sonrakı dəyişiklik ona toxunmur."

- question: Bu kod nə çap edəcək?
  code: |
    var s Shipping = Locker{}
    c, ok := s.(Courier)
    fmt.Println(c.PerKg, ok)
  options: ["0 false", "panic", "4 true"]
  answer: 0
  explain: "Tip uyğun gəlmir: `ok` `false` olur, `c` isə `Courier`-in zero value-sudur."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    var s Shipping = Locker{}
    c := s.(Courier)
    fmt.Println(c.PerKg)
  options: ["proqram panic ilə dayanır", "`0` çap olunur", "kompilyasiya xətası"]
  answer: 0
  explain: "`ok`-suz type assertion tip uyğun gəlməyəndə panic verir."

- question: Bu kod nə çap edəcək?
  code: |
    func kind(v any) string {
        switch v.(type) {
        case int:
            return "int"
        case string:
            return "string"
        default:
            return "other"
        }
    }

    fmt.Println(kind(3.5), kind("7"))
  options: ["other string", "int string", "other int"]
  answer: 0
  explain: "`3.5` `float64`-dür və `default`-a düşür, `\"7\"` isə dırnaqda olduğu üçün `string`-dir."
