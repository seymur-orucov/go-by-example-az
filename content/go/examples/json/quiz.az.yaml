- question: Bu kod nə çap edəcək?
  code: |
    type Item struct {
        Name string `json:"name"`
        Qty  int    `json:"qty,omitempty"`
    }

    b, _ := json.Marshal(Item{Name: "tea"})
    fmt.Println(string(b))
  options: ['{"name":"tea","qty":0}', '{"name":"tea"}', '{"Name":"tea"}']
  answer: 1
  explain: "`Qty` zero value-dur və `omitempty` onu JSON-a yazmır."

