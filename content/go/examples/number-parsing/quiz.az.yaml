- question: Bu kod nə çap edəcək?
  code: |
    n, err := strconv.Atoi("6.5")
    fmt.Println(n, err != nil)
  options: ["6 false", "0 true", "6 true"]
  answer: 1
  explain: "`Atoi` yalnız tam ədəd oxuyur: `6.5` səhv yazılışdır, nəticə `0` və xətadır."

- question: Bu kod nə çap edəcək?
  code: |
    a := "4"
    b, _ := strconv.Atoi(a)
    fmt.Println(a+a, b+b)
  options: ["44 8", "8 8", "44 44"]
  answer: 0
  explain: "String-lərdə `+` yapışdırır, ədədlərdə isə toplayır."

- question: Hansı sətir kompilyasiya olunmur?
  options: ["`n, err := strconv.Atoi(\"42\")`", "`s := strconv.Itoa(42)`", "`n := int(\"42\")`"]
  answer: 2
  explain: "Mətni tip çevirməsi ilə ədədə çevirmək olmaz (`cannot convert`), bunun üçün `strconv` lazımdır."

- question: Bu kod nə çap edəcək?
  code: |
    n, _ := strconv.ParseInt("ff", 16, 64)
    fmt.Println(n)
  options: ["ff", "15", "255"]
  answer: 2
  explain: "Hex-də `f` 15-dir: 15·16 + 15 = 255."

- question: Bu kod nə çap edəcək?
  code: |
