  options: ["1010", "2", "0101"]
  answer: 0
  explain: "`FormatInt` 10-u ikilik say sistemində yazır: 8 + 2, yəni `1010`."

- question: Bu kod nə çap edəcək?
  code: |
    n, err := strconv.ParseInt("200", 10, 8)
    fmt.Println(n, errors.Is(err, strconv.ErrRange))
  options: ["200 false", "0 true", "127 true"]
  answer: 2
  explain: "200 `int8`-ə sığmır: `ParseInt` ən yaxın sərhədi, 127-ni və `ErrRange` xətasını qaytarır."

- question: Bu kod nə çap edəcək?
  code: |
    b, err := strconv.ParseBool("yes")
    fmt.Println(b, err == nil)
  options: ["true true", "false false", "false true"]
  answer: 1
  explain: "`ParseBool` `yes`-i tanımır: nəticə `false`, xəta isə `nil` deyil."

- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(string(rune(65)), strconv.Itoa(65))
  options: ["65 65", "A 65", "A A"]
  answer: 1
  explain: "`string(rune(65))` Unicode nömrəsi 65 olan hərfi verir, `Itoa` isə ədədin yazılışını."

