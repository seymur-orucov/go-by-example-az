    fmt.Println(s.Hello(), s.Base.Hello())
  options: ["shop base", "base base", "shop shop"]
  answer: 0
  explain: "Xarici tipin metodu daxilini gizlədir, daxiliyə isə tam yolla çatmaq olar."

