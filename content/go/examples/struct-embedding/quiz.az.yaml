- question: Bu kod nə çap edəcək?
  code: |
    type Battery struct {
        Level int
    }

    type Phone struct {
        Model string
        Battery
    }

    p := Phone{Model: "Z5", Battery: Battery{Level: 90}}
    fmt.Println(p.Level)
  options: ["90", "0", "kompilyasiya xətası, `p.Battery.Level` yazmaq lazımdır"]
  answer: 0
