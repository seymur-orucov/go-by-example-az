- question: Bu kod nə çap edəcək?
  code: |
    func (b *Battery) Charge() {
        b.Level = 100
    }

    p := Phone{Battery: Battery{Level: 20}}
    p.Charge()
    fmt.Println(p.Level)
  options: ["100", "20", "kompilyasiya xətası"]
  answer: 0
  explain: "Metod da keçir; `p.Charge()` `p.Battery`-nin ünvanı ilə çağırılır və onu dəyişir."

- question: Bu kod nə çap edəcək?
