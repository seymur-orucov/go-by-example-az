- question: Bu imzalardan hansı channel-dan yalnız qəbul etməyə icazə verir?
  options: ["`func show(t <-chan int)`", "`func show(t chan<- int)`", "`func show(t chan int)`"]
  answer: 0
  explain: "Ox `chan`-dan çıxır: dəyər channel-dan çıxır, yəni yalnız qəbul etmək olar."

- question: Bu funksiyada hansı sətir kompilyasiya olunmur?
  code: |
    func report(scores <-chan int) {
        a := <-scores      // 1
        scores <- a + 1    // 2
        fmt.Println(a)     // 3
    }
  options: ["2", "1", "3"]
  answer: 0
  explain: "`scores` receive-only channel-dır, ona göndərmək olmaz."

- question: "`func send(out chan<- int)` funksiyasının içində hansı sətir kompilyasiya olunmur?"
  options: ["`v := <-out`", "`out <- 5`", "`fmt.Println(len(out))`"]
  answer: 0
  explain: "Send-only channel-dan qəbul etmək olmaz; `len` isə istənilən channel üçün işləyir."

- question: Hansı sətir kompilyasiya olunmur?
  code: |
    ch := make(chan int)
    var in <-chan int = ch   // 1
    var back chan int = in   // 2
  options: ["2", "1", "hər ikisi kompilyasiya olunur"]
  answer: 0
  explain: "İki tərəfli channel tək istiqamətliyə özü çevrilir, əksinə isə çevrilmir."

- question: Bu kod nə çap edəcək?
  code: |
    func addTen(in <-chan int, out chan<- int) {
        for range 2 {
            out <- <-in + 10
        }
    }

    nums := make(chan int)
    res := make(chan int)
    go addTen(nums, res)
    go func() {
        nums <- 3
        nums <- 4
    }()
    fmt.Println(<-res, <-res)
  options: ["13 14", "14 13", "3 4"]
  answer: 0
  explain: "`addTen` dəyərləri gəldiyi sıra ilə bir-bir emal edir, ona görə sıra qorunur."

- question: Bu kod nə çap edəcək?
  code: |
    func start() <-chan string {
        ch := make(chan string, 1)
        ch <- "ready"
        return ch
    }

    fmt.Println(<-start())
  options: ["ready", "kompilyasiya xətası: `ch` `<-chan string` deyil", "proqram `deadlock` xətası ilə dayanır"]
  answer: 0
  explain: "`return` zamanı iki tərəfli `ch` özü `<-chan string`-ə çevrilir, buffer-dəki dəyər isə dərhal qəbul olunur."
