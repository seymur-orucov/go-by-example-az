- question: Bu kod nə çap edəcək?
  code: |
    ctx, cancel := context.WithCancel(context.Background())
    fmt.Println(ctx.Err())
    cancel()
    fmt.Println(ctx.Err())
  options:
    - "`<nil>`, sonra `context canceled`"
    - "`context canceled` iki dəfə"
    - "`<nil>` iki dəfə"
  answer: 0
  explain: "Context bitməyənə qədər `Err()` `nil` qaytarır, `cancel()`-dan sonra isə səbəbi."

- question: Bu kod nə çap edəcək?
  code: |
    parent, stopParent := context.WithCancel(context.Background())
    defer stopParent()
    child, stopChild := context.WithCancel(parent)
    stopChild()
    fmt.Println(parent.Err())
  options: ["context canceled", "<nil>"]
  answer: 1
  explain: "Siqnal yalnız valideyndən övlada gedir; övladı dayandırmaq valideynə təsir etmir."

- question: Bu kod nə çap edəcək?
  code: |
    ctx, cancel := context.WithTimeout(context.Background(), 50*time.Millisecond)
    defer cancel()
    <-ctx.Done()
    fmt.Println(ctx.Err())
  options: ["context canceled", "<nil>", "context deadline exceeded"]
  answer: 2
  explain: "`Done()` vaxt limiti bitəndə bağlanır və səbəb `context deadline exceeded` olur."

- question: Bu kodda nə problem var?
  code: |
    ctx, _ := context.WithTimeout(context.Background(), time.Second)
    fetch(ctx)
  options:
    - "kompilyasiya xətası"
    - "problem yoxdur"
    - "context heç vaxt bitmir"
    - "`cancel` atılıb: resurs sızması, `go vet` xəbərdarlıq edir"
  answer: 3
  explain: "Kod işləyir, amma `cancel` çağırılmadığı üçün context-in resursları vaxtından əvvəl azad olunmur; `go vet` bunu tapır."

