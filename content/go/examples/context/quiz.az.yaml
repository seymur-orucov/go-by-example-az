- question: Bu kod nə çap edəcək?
  code: |
    parent, stop1 := context.WithTimeout(context.Background(), 50*time.Millisecond)
    defer stop1()
    child, stop2 := context.WithTimeout(parent, time.Hour)
    defer stop2()
    <-child.Done()
    fmt.Println(errors.Is(child.Err(), context.DeadlineExceeded))
  options: ["false", "true"]
  answer: 1
  explain: "Övlad valideyndən uzun yaşaya bilməz: valideynin 50 ms-i bitəndə övlad da eyni səbəblə bitir."

- question: Bu kod nə çap edəcək?
  code: |
    ctx, cancel := context.WithCancel(context.Background())
    cancel()
    fmt.Println(errors.Is(ctx.Err(), context.DeadlineExceeded))
  options: ["true", "kompilyasiya xətası", "false"]
