- question: Bu kod nə çap edəcək?
  code: |
    fmt.Println(cmp.Compare(3, 7), cmp.Compare("b", "a"), cmp.Compare(2.5, 2.5))
  options: ["1 -1 0", "-1 1 0", "-4 1 0"]
  answer: 1
  explain: "`cmp.Compare` fərqi yox, yalnız işarəni qaytarır: kiçikdirsə `-1`, böyükdürsə `1`, bərabərdirsə `0`."

- question: Bu kod nə çap edəcək?
