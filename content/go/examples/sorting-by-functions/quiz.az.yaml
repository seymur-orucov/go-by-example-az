    - "müqayisə funksiyası `bool` yox, `int` qaytarmalıdır"
    - "funksiyanı arqument kimi birbaşa yazmaq olmaz"
  answer: 1
  explain: "`SortFunc` `func(a, b T) int` gözləyir: bərabərlik halı üçün üç cavab lazımdır."

- question: Bu kod nə çap edəcək?
  code: |
    type Task struct {
        Name     string
        Priority int
    }
    tasks := []Task{{"wash", 2}, {"cook", 1}, {"shop", 2}, {"read", 1}}
    slices.SortStableFunc(tasks, func(a, b Task) int {
        return cmp.Compare(a.Priority, b.Priority)
    })
    fmt.Println(tasks)
  options:
    - "[{cook 1} {read 1} {shop 2} {wash 2}]"
    - "[{read 1} {cook 1} {wash 2} {shop 2}]"
    - "[{wash 2} {shop 2} {cook 1} {read 1}]"
    - "[{cook 1} {read 1} {wash 2} {shop 2}]"
  answer: 3
  explain: "Sabit sıralama eyni prioritetli tapşırıqları əvvəlki sırada saxlayır: `cook` `read`-dən, `wash` `shop`-dan öndədir."

- question: Bu kod nə çap edəcək?
  code: |
    type Item struct {
        Name string
        Qty  int
    }
    stock := []Item{{"pens", 3}, {"cups", 5}, {"bags", 3}}
    slices.SortFunc(stock, func(a, b Item) int {
        return cmp.Or(
            cmp.Compare(b.Qty, a.Qty),
            cmp.Compare(a.Name, b.Name),
        )
    })
    fmt.Println(stock)
  options:
    - "[{cups 5} {bags 3} {pens 3}]"
    - "[{bags 3} {pens 3} {cups 5}]"
    - "[{cups 5} {pens 3} {bags 3}]"
  answer: 0
  explain: "Əvvəl miqdar azalan sıra ilə müqayisə olunur, bərabər miqdarda isə ad həll edir."
