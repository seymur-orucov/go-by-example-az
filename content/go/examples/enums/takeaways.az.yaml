rules:
  - "Go-da `enum` açar sözü yoxdur: sadalama öz tipi və `const` blokunda `iota` ilə yaradılır."
  - "`iota` hər `const` blokunda `0`-dan başlayır və hər sətirdə bir artır; tip və ifadə növbəti sətirlərdə təkrarlanır."
  - "`String() string` metodu olan dəyəri `fmt.Println` rəqəmlə yox, metodun qaytardığı mətnlə çap edir."
  - "`Stage` tipli sabit başqa tipə yazıla bilməz, tipsiz ədəd isə (`start(2)`) yenə də keçir."
  - "Tipin zero value-su `0`-dır, yəni ilk sabit."
practices:
  - "İlk sabit həm də zero value-dur, ona görə o ya real başlanğıc vəziyyəti (`Idle`), ya da \"təyin olunmayıb\" (`Unknown`) olsun."
  - "`String()`-də naməlum dəyər üçün də nəticə qaytarın, məsələn `\"unknown\"`."
