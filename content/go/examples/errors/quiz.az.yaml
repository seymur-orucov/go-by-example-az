- question: Bu kod nə çap edəcək?
  code: |
    func half(n int) (int, error) {
        if n%2 != 0 {
            return 0, errors.New("odd number")
        }
        return n / 2, nil
    }

    r, err := half(7)
    fmt.Println(r, err)
  options: ["3 odd number", "0 odd number", "3 <nil>"]
  answer: 1
  explain: "Tək ədəddə funksiya `0` və xəta qaytarır, `fmt` xətanın mətnini çap edir."

- question: Bu kod nə çap edəcək?
  code: |
    r, err := half(8)
    fmt.Println(r, err)
  options: ["4", "4 nil", "4 <nil>"]
  answer: 2
  explain: "Uğurlu halda xəta `nil`-dir və `fmt` onu `<nil>` kimi çap edir."

- question: Bu kod nə çap edəcək?
