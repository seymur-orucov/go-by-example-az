- question: Bu kod nə çap edəcək?
  code: |
    err := fmt.Errorf("load: %w", ErrNotFound)
    fmt.Println(err == ErrNotFound, errors.Is(err, ErrNotFound))
  options: ["true true", "false true", "false false"]
  answer: 1
  explain: "Bükülmüş xəta yeni dəyərdir, `errors.Is` isə içəridəki xətanı tapır."

- question: Bu kod nə çap edəcək?
  code: |
    err := fmt.Errorf("load: %v", ErrNotFound)
    fmt.Println(errors.Is(err, ErrNotFound))
  options: ["true", "false"]
  answer: 1
  explain: "`%v` yalnız mətni götürür, orijinal xəta zəncirə düşmür."

- question: Bu kod nə çap edəcək?
  code: |
    inner := fmt.Errorf("db: %w", ErrNotFound)
    err := fmt.Errorf("api: %w", inner)
    fmt.Println(err)
  options: ["book not found", "api: book not found", "api: db: book not found"]
  answer: 2
  explain: "Hər bükmə öz kontekstini əvvələ əlavə edir."

- question: Bu kod niyə kompilyasiya olunmur?
  code: |
    n := half(4)
    fmt.Println(n)
  options:
    - "`half` iki nəticə qaytarır, onları bir dəyişənə yazmaq olmaz"
    - "xəta mütləq `if` ilə yoxlanmalıdır"
    - "`half(4)` xəta qaytarır"
  answer: 0
  explain: "Nəticələrin sayı dəyişənlərin sayı ilə üst-üstə düşməlidir; xəta lazım deyilsə, `n, _ := half(4)` yazılır."

- question: Bu kod niyə kompilyasiya olunmur?
  code: |
    r, err := half(4)
    fmt.Println(r)
  options:
    - "`half` yalnız bir nəticə qaytarır"
    - "`r` `int` deyil"
    - "`err` elan olunub, amma istifadə olunmayıb"
  answer: 2
  explain: "Go istifadə olunmayan lokal dəyişənə icazə vermir: `err` ya yoxlanmalı, ya da açıq şəkildə `_` ilə atılmalıdır."
