- question: Bu kod nə çap edəcək?
  code: |
    type TimeoutError struct {
        Seconds int
    }

    func (e TimeoutError) Error() string {
        return "timeout"
    }

    var err error = TimeoutError{Seconds: 5}
    fmt.Println(err)
  options: ["timeout", "{5}", "kompilyasiya xətası"]
  answer: 0
  explain: "`fmt` xətanı onun `Error()` metodunun mətni ilə çap edir."

- question: Bu kod nə çap edəcək?
  code: |
    err := fmt.Errorf("fetch: %w", TimeoutError{Seconds: 5})
    var te TimeoutError
    fmt.Println(errors.As(err, &te), te.Seconds)
  options: ["true 5", "false 0", "true 0"]
  answer: 0
  explain: "`errors.As` bükülmüş zəncirdə `TimeoutError` tapır və onu `te`-yə yazır."

- question: Bu kod nə çap edəcək?
  code: |
    type WrapError struct {
        Err error
    }

    func (w WrapError) Error() string {
        return "wrap: " + w.Err.Error()
    }

    err := WrapError{Err: ErrBusy}
    fmt.Println(errors.Is(err, ErrBusy))
  options: ["false", "true"]
  answer: 0
  explain: "`WrapError`-un `Unwrap` metodu yoxdur, ona görə `errors.Is` içəridəki xətanı görmür."

