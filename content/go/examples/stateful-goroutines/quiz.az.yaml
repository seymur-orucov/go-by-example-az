- question: Bu kod nə çap edəcək?
  code: |
    adds := make(chan int)
    total := make(chan int)
    go func() {
        sum := 0
        for n := range adds {
            sum += n
        }
        total <- sum
    }()
    for _, n := range []int{5, 10, 20} {
        adds <- n
    }
    close(adds)
    fmt.Println(<-total)
  options: ["35", "0", "deadlock xətası"]
  answer: 0
  explain: "`sum`-a yalnız bir goroutine toxunur; `close` dövrü bitirir və o, cəmi `total`-a göndərir."

