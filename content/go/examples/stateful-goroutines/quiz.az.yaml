- question: Dərsdəki `keeper` və `ask` ilə bu kod nə çap edəcək?
  code: |
    requests := make(chan request)
    go keeper(requests)
    fmt.Println(
        ask(requests, "take", "helmets", 50),
        ask(requests, "take", "helmets", 15),
        ask(requests, "check", "helmets", 0),
    )
  options: ["0 15 25", "40 15 0", "0 15 40"]
  answer: 0
  explain: "50 dəbilqə yoxdur və ilk sorğu 0 alır, ikinci 15 alır, qalıq 40 − 15 = 25 olur."

- question: Dərsdəki `keeper` ilə bu çağırış nə edəcək?
  code: |
    requests := make(chan request)
    go keeper(requests)
    fmt.Println(ask(requests, "return", "boots", 2))
  options:
    - "`fatal error: all goroutines are asleep - deadlock!`"
    - "0 çap edir"
    - "`keeper` panic edir"
  answer: 0
  explain: "`keeper`-in `switch`-ində `\"return\"` yoxdur və cavab göndərmir: `ask` cavabı, `keeper` isə növbəti sorğunu gözləyir."

- question: Bu kod işə düşəndə nə olacaq?
  code: |
    requests := make(chan request)
    go keeper(requests)
    close(requests)
    fmt.Println(ask(requests, "check", "boots", 0))
  options: ["`panic: send on closed channel`", "0 çap edir", "deadlock xətası"]
  answer: 0
  explain: "`ask` bağlanmış channel-a göndərir, bu isə panic-dir; ona görə `requests`-i yalnız bütün sorğular bitəndən sonra bağlayırıq."

- question: "Dərsin proqramında `close(requests)` yazılmasa, nə olar?"
  options:
